<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f4ec" />
    <meta
      name="description"
      content="A simple Disneyland and Disney California Adventure ride checklist."
    />
    <title>Park List</title>
    <script>
      if (/Android/i.test(navigator.userAgent)) document.documentElement.classList.add("android");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">A day at the parks</p>
        <h1>What’s next?</h1>
        <p class="intro">Filter the list, then tap the circle as you go.</p>
      </header>

      <p class="version" aria-label="App version 1.1.0">v1.1.0</p>

      <nav class="filters" aria-label="Filter rides">
        <button class="filter-button" type="button" data-filter="DL" aria-pressed="false">
          <span>DL</span>
          <small>Disneyland</small>
        </button>
        <button class="filter-button" type="button" data-filter="CA" aria-pressed="false">
          <span>CA</span>
          <small>California Adventure</small>
        </button>
        <button class="filter-button" type="button" data-filter="1" aria-pressed="false">
          <span>1</span>
          <small>Priority one</small>
        </button>
        <button class="filter-button" type="button" data-filter="2" aria-pressed="false">
          <span>2</span>
          <small>Priority two</small>
        </button>
      </nav>

      <section class="list-section" aria-labelledby="list-heading">
        <div class="list-heading-row">
          <div>
            <p class="section-kicker" id="filter-label">All attractions</p>
            <h2 id="list-heading">Ride list</h2>
          </div>
          <p class="count" id="ride-count" aria-live="polite"></p>
        </div>

        <div class="status" id="status" role="status">
          <span class="spinner" aria-hidden="true"></span>
          Loading the magic…
        </div>
        <ul class="ride-list" id="ride-list" aria-label="Attractions"></ul>
      </section>
    </main>
  </body>
</html>
